<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بطاقة جرد الأجهزة</title><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>بطاقة جرد الأجهزة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a paper asset-tag form; each device is a tag card with a perforated top edge */
:root{
  --bg:#eef2f1; --paper:#ffffff; --ink:#0f2a2e; --muted:#5b6f71; --line:#cfdad8;
  --accent:#0b6e75; --accent-ink:#ffffff; --tag:#f2b233; --tag-ink:#2a1d00;
  --ok:#1f7a45; --warn:#a15c00; --bad:#b3261e; --soft:#e3ecea;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1718; --paper:#152224; --ink:#e4efee; --muted:#93a7a8; --line:#28393b;
  --accent:#3fb3bb; --accent-ink:#04201f; --tag:#f2b233; --tag-ink:#2a1d00;
  --ok:#5fd394; --warn:#f0a94a; --bad:#ff8a80; --soft:#1c2c2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1718; --paper:#152224; --ink:#e4efee; --muted:#93a7a8; --line:#28393b;
  --accent:#3fb3bb; --accent-ink:#04201f; --tag:#f2b233; --tag-ink:#2a1d00;
  --ok:#5fd394; --warn:#f0a94a; --bad:#ff8a80; --soft:#1c2c2e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:16px}
header{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600}
h1{font-size:24px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
section.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
h2 .n{font-family:var(--f-mono);font-size:12px;background:var(--soft);color:var(--muted);border-radius:6px;padding:1px 7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f > input,label.f > select,label.f > textarea,label.f > .hint{display:block;margin-top:4px}
label.f .req{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.sn{font-family:var(--f-mono);font-size:17px;letter-spacing:.06em;text-transform:uppercase;direction:ltr;text-align:left}
.bad{border-color:var(--bad)!important}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.hint.warn{color:var(--warn)} .hint.err{color:var(--bad)} .hint.ok{color:var(--ok)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink)}
.chk input{width:auto}
button{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 14px;cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
/* device tag card */
.dev{background:var(--paper);border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.dev .tagtop{background:var(--tag);color:var(--tag-ink);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700}
.dev .tagtop .id{font-family:var(--f-mono);font-size:13px}
.dev .tagtop::after{content:"";position:absolute;inset:38px 0 auto;height:6px;background:radial-gradient(circle at 6px 0,transparent 4px,var(--paper) 4.5px) 0 0/12px 6px repeat-x}
.dev .body{padding:18px 14px 14px;display:grid;gap:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;max-width:100%;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;left:4px;padding:0 7px;border-radius:6px;font-size:13px;line-height:22px}
.thumb .lbl{position:absolute;bottom:0;inset-inline:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;text-align:center}
.photoBtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--accent);color:var(--accent);border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.photoBtn input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;direction:ltr}
.chip.on{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:0 0 auto}
.sticky{position:fixed;bottom:0;inset-inline:0;background:var(--paper);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.sticky .in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.sticky .in .grow{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.issues{display:grid;gap:4px;margin:0;padding:0 18px 0 0;color:var(--bad);font-size:14px}
pre.msg{unicode-bidi:plaintext;text-align:start;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.6 var(--f-body);max-height:320px;overflow:auto;margin:0}
.panel[hidden]{display:none}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.stamps img{border-radius:8px;border:1px solid var(--line);width:100%}
.log{display:grid;gap:6px;font-size:14px}
.log .it{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log .it .mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);direction:ltr}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.dev{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">لجنة جرد الأجهزة</span>
    <h1>بطاقة جرد موظف</h1>
    <p class="sub">اكتب اسم الموظف وصوّر أجهزته. لما تخلص اضغط «إرسال» وابعث للجروب.</p>
  </header>

  <section class="box" id="secEmp">
    <h2>الموظف</h2>
    <label class="f">اسم الموظف <span class="req">*</span>
      <input id="emp" autocomplete="off" placeholder="اكتب الاسم كامل"></label>
    <div class="grid2">
      <label class="f">القسم <span class="hint">(اختياري)</span>
        <input id="dept" autocomplete="off" placeholder="مثال: الشؤون الإدارية"></label>
      <label class="f">الرقم الوظيفي <span class="hint">(اختياري)</span>
        <input id="empNo" inputmode="numeric" autocomplete="off" placeholder="مثال: 1234"></label>
    </div>
  </section>

  <div id="devices" class="wrap" style="gap:16px"></div>
  <button class="ghost" id="addDev" type="button">+ إضافة جهاز آخر لنفس الموظف</button>

  <section class="box panel" id="outPanel" hidden>
    <h2>جاهز للإرسال</h2>
    <p class="hint" id="shareNote"></p>
    <div class="row">
      <button class="primary" id="btnShare" type="button">مشاركة الصور + الرسالة على واتساب</button>
      <button id="btnCopy" type="button">نسخ الرسالة</button>
      <a id="waText" href="#" target="_blank" rel="noopener"><button type="button" tabindex="-1">إرسال الرسالة فقط</button></a>
    </div>
    <pre class="msg" id="msg"></pre>
    <div class="stamps" id="stamps"></div>
    <div class="row"><button class="primary" id="btnNew" type="button">✓ تم الإرسال – موظف جديد</button></div>
  </section>
</div>

<div class="sticky"><div class="in">
  <div class="grow" id="status"></div>
  <button class="primary" id="btnPrep" type="button">إرسال</button>
</div></div>

<datalist id="dlTypes"><option value="حاسوب مكتبي"><option value="لابتوب"><option value="شاشة"><option value="طابعة"><option value="آلة تصوير"><option value="سكانر"><option value="فاكس"><option value="جهاز لوحي (تابلت)"><option value="جهاز قراءة عدادات HHU"><option value="طابعة متنقلة"><option value="GPS"></datalist>

<datalist id="dlBrands"><option value="Dell"><option value="HP"><option value="Lenovo"><option value="Acer"><option value="Fujitsu"><option value="Terra"><option value="IBM"><option value="Canon"><option value="Pantum"><option value="Xerox"><option value="Brother"><option value="Ricoh"><option value="Sharp"><option value="Konica Minolta"><option value="Kyocera"><option value="Samsung"><option value="Epson"><option value="OKI"><option value="Avision"><option value="Plustek"><option value="Zebra"><option value="Blackview"></datalist>

<template id="tplDev">
  <div class="dev">
    <div class="tagtop"><span class="t">جهاز</span><span class="id"></span></div>
    <div class="body">
      <div class="grid2">
        <label class="f">نوع الجهاز <span class="hint">(اختياري)</span>
          <input class="type" list="dlTypes" autocomplete="off" placeholder="اختر من القائمة أو اكتب"></label>
        <label class="f">الماركة <span class="hint">(اختياري)</span>
          <input class="brand" list="dlBrands" autocomplete="off" placeholder="اختر من القائمة أو اكتب"></label>
      </div>
      <div class="thumbs"></div>
      <label class="photoBtn">📷 أضف صور الجهاز (صورة عامة + صورة الملصق)
        <input type="file" class="photos" accept="image/*" multiple></label>
      <label class="f">ملاحظة <span class="hint">(اختياري)</span>
        <input class="notes" autocomplete="off" placeholder="مثال: معطل، بالمستودع، عهدة شخص آخر…"></label>
      <div class="row"><button type="button" class="ghost danger rm">حذف هذا الجهاز</button></div>
    </div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

let devices = [];
let recId = newRecId();
function newRecId(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${Math.random().toString(36).slice(2, 4).toUpperCase()}`;
}

function addDevice(){
  const el = $("#tplDev").content.firstElementChild.cloneNode(true);
  const d = {el, photos:[]};
  devices.push(d);
  const q = s => el.querySelector(s);
  q(".rm").addEventListener("click", () => { if(devices.length === 1){ toast("لازم يضل جهاز واحد على الأقل"); return; } d.photos.forEach(p => URL.revokeObjectURL(p.url)); devices = devices.filter(x => x !== d); el.remove(); refresh(); });
  el.addEventListener("input", refresh);
  q(".photos").addEventListener("change", e => {
    [...e.target.files].forEach(f => d.photos.push({file:f, url:URL.createObjectURL(f)}));
    e.target.value = ""; renderThumbs(d); refresh();
  });
  $("#devices").appendChild(el);
  refresh();
  return d;
}
function renderThumbs(d){
  const box = d.el.querySelector(".thumbs"); box.innerHTML = "";
  d.photos.forEach((p, i) => {
    const t = document.createElement("div"); t.className = "thumb";
    t.innerHTML = `<img alt=""><span class="lbl">صورة ${AR(i+1)}</span><button type="button" aria-label="حذف الصورة">×</button>`;
    t.querySelector("img").src = p.url;
    t.querySelector("button").onclick = () => { URL.revokeObjectURL(p.url); d.photos.splice(i, 1); renderThumbs(d); refresh(); };
    box.appendChild(t);
  });
}
function refresh(){
  devices.forEach((d, i) => {
    const type = [d.el.querySelector(".type").value.trim(), d.el.querySelector(".brand").value.trim()].filter(Boolean).join(" ");
    d.el.querySelector(".tagtop .t").textContent = `جهاز ${AR(i+1)}` + (type ? ` · ${type}` : "");
    d.el.querySelector(".tagtop .id").textContent = `${AR(d.photos.length)} صور`;
  });
  const n = devices.reduce((a, d) => a + d.photos.length, 0);
  $("#status").textContent = `${AR(devices.length)} ${devices.length > 1 ? "أجهزة" : "جهاز"} · ${AR(n)} صور`;
}

function collect(){
  const d = new Date();
  return {
    id: recId,
    date: d.toLocaleDateString("en-GB"), time: d.toTimeString().slice(0, 5),
    emp: $("#emp").value.trim().replace(/\s+/g, " "), dept: $("#dept").value.trim(), empNo: $("#empNo").value.trim(),
    devices: devices.map((x, i) => ({n:i+1, type:x.el.querySelector(".type").value.trim(), brand:x.el.querySelector(".brand").value.trim(), notes:x.el.querySelector(".notes").value.trim(), photos:x.photos.length}))
  };
}
function validate(r){
  const errs = [];
  $("#emp").classList.toggle("bad", !r.emp);
  if(!r.emp) errs.push("اكتب اسم الموظف.");
  r.devices.forEach((x, i) => { if(!x.photos) errs.push(`جهاز ${AR(i+1)}: أضف صورة واحدة على الأقل.`); });
  return errs;
}

// Plain message the custody clerk can copy from directly
function buildMsg(r){
  const L = [];
  L.push(`📋 جرد: ${r.emp}`);
  if(r.dept) L.push(`القسم: ${r.dept}`);
  if(r.empNo) L.push(`الرقم الوظيفي: ${r.empNo}`);
  L.push(`عدد الأجهزة: ${r.devices.length}`);
  r.devices.forEach(x => {
    let s = `${x.n}) ${x.type || "جهاز"}${x.brand ? " " + x.brand : ""}`;
    if(x.notes) s += ` – ${x.notes}`;
    s += x.photos === 1 ? " (صورة وحدة)" : x.photos === 2 ? " (صورتين)" : ` (${x.photos} صور)`;
    L.push(s);
  });
  L.push(`التاريخ: ${r.date} ${r.time} · رقم البطاقة: ${r.id}`);
  return L.join("\n");
}

function loadImg(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
async function stamp(photo, r, x, k){
  const img = await loadImg(photo.url);
  const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
  const fs = Math.max(18, Math.round(w / 32)), band = fs * 3.2, pad = fs * .6;
  const c = document.createElement("canvas"); c.width = w; c.height = h + band;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0, w, h);
  g.fillStyle = "#f2b233"; g.fillRect(0, h, w, band);
  g.fillStyle = "#1b1300"; g.direction = "rtl"; g.textAlign = "right"; g.textBaseline = "top";
  g.font = `700 ${fs}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
  g.fillText(`${r.emp}${r.dept ? " · " + r.dept : ""}`, w - pad, h + pad * .6);
  g.font = `500 ${fs * .8}px "IBM Plex Sans Arabic", Tahoma, sans-serif`;
  g.fillText(`جهاز ${x.n} من ${r.devices.length}${x.type ? " · " + x.type : ""}${x.brand ? " " + x.brand : ""} · صورة ${k} من ${x.photos} · ${r.id}`, w - pad, h + pad * .6 + fs * 1.4);
  const blob = await new Promise(res => c.toBlob(res, "image/jpeg", .85));
  return new File([blob], `${r.id}-${x.n}-${k}.jpg`, {type:"image/jpeg"});
}

let outFiles = [], outText = "";
async function prepare(){
  const r = collect(); const errs = validate(r);
  document.querySelectorAll("section.issues").forEach(e => e.remove());
  if(errs.length){
    const box = document.createElement("section"); box.className = "box issues";
    box.innerHTML = "<h2>لازم تكمل هدول قبل الإرسال</h2>";
    const ul = document.createElement("ul"); ul.className = "issues";
    errs.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    box.appendChild(ul); $("#addDev").after(box); box.scrollIntoView({behavior:"smooth", block:"center"}); return;
  }
  $("#btnPrep").disabled = true; $("#btnPrep").textContent = "جاري التجهيز…";
  outText = buildMsg(r); outFiles = [];
  for(let i = 0; i < r.devices.length; i++)
    for(let k = 0; k < devices[i].photos.length; k++) outFiles.push(await stamp(devices[i].photos[k], r, r.devices[i], k + 1));
  $("#msg").textContent = outText;
  const st = $("#stamps"); st.innerHTML = "";
  outFiles.forEach(f => { const im = document.createElement("img"); im.alt = f.name; im.src = URL.createObjectURL(f); st.appendChild(im); });
  $("#waText").href = "https://wa.me/?text=" + encodeURIComponent(outText);
  const can = !!(navigator.canShare && navigator.canShare({files: outFiles.slice(0, 1)}));
  $("#btnShare").hidden = !can;
  $("#shareNote").textContent = can
    ? "اضغط «مشاركة» واختر جروب اللجنة. الرسالة انسخت كمان، فإذا وصلت الصور بدونها الصقها كرسالة بعدها."
    : "المتصفح هنا ما بيسمح بمشاركة الصور مباشرة. اضغط مطولاً على كل صورة واحفظها، وابعثها للجروب، وبعدها اضغط «إرسال الرسالة فقط».";
  $("#outPanel").hidden = false; $("#outPanel").scrollIntoView({behavior:"smooth"});
  $("#btnPrep").disabled = false; $("#btnPrep").textContent = "إرسال";
  copyText(true);
}
async function copyText(silent){
  try{ await navigator.clipboard.writeText(outText); if(!silent) toast("انسخت الرسالة"); }
  catch(e){ const rg = document.createRange(); rg.selectNodeContents($("#msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); if(!silent) toast("الرسالة محددة – انسخها يدوياً"); }
}
async function share(){
  await copyText(true);
  try{ await navigator.share({files: outFiles, text: outText}); }
  catch(e){ if(e && e.name !== "AbortError") toast("تعذّرت المشاركة. احفظ الصور يدوياً واستعمل «نسخ الرسالة»."); }
}
function startNew(){
  devices.forEach(d => d.photos.forEach(p => URL.revokeObjectURL(p.url)));
  devices = []; $("#devices").innerHTML = ""; $("#outPanel").hidden = true;
  ["#emp","#dept","#empNo"].forEach(s => { $(s).value = ""; $(s).classList.remove("bad"); });
  recId = newRecId(); addDevice(); window.scrollTo({top:0, behavior:"smooth"}); toast("جاهز للموظف التالي");
}

["#emp","#dept","#empNo"].forEach(s => $(s).addEventListener("input", refresh));
$("#addDev").onclick = () => { const d = addDevice(); d.el.scrollIntoView({behavior:"smooth", block:"start"}); };
$("#btnPrep").onclick = prepare; $("#btnCopy").onclick = () => copyText(false); $("#btnShare").onclick = share; $("#btnNew").onclick = startNew;
addDevice();
</script>
</body></html>
